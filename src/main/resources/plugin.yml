name: Blackjack
version: 2.4
main: com.vortex.blackjack.BlackjackPlugin
description: Minecraft için fiziksel 3D masalı Blackjack (21) eklentisi
api-version: 1.21
depend: [packetevents, Vault]
# PhysicalEconomy must register its Vault service before Blackjack asks Vault for it.
# Keep this as a soft dependency: the plugin still supports every Vault economy provider.
softdepend: [PlaceholderAPI, PhysicalEconomy]
loadbefore: []
# Economy plugins normally register their providers during the POSTWORLD phase.
load: POSTWORLD

commands:
  blackjack:
    description: Blackjack eklentisi yönetici komutu
    usage: |
      &8[&6Blackjack&8] &rYönetici Komutları:
      &e/bj createtable [min-bet:<n>] [max-bet:<n>] [max-players:<n>] [max-join-distance:<n>] &7- Blackjack masası oluşturur
      &e/bj settable <ayar> <değer> &7- En yakın masanın ayarlarını değiştirir
      &e/bj removetable &7- En yakın masayı kaldırır
      &e/bj reload &7- Yapılandırmayı yeniden yükler
      &e/bj version &7- Eklenti sürümünü ve durumunu kontrol eder
    aliases: [bj]

permissions:
  blackjack.admin:
    description: Blackjack masalarını oluşturma, silme ve yapılandırma yetkisi verir
    default: op
  blackjack.play:
    description: Blackjack oynama yetkisi verir
    default: true
  blackjack.stats.others:
    description: Diğer oyuncuların istatistiklerini kontrol etme yetkisi verir
    default: op
