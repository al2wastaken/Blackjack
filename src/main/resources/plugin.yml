name: Blackjack
version: 3.0
main: com.vortex.blackjack.BlackjackPlugin
description: Physical 3D blackjack tables for Minecraft servers
api-version: 1.21
depend: [packetevents, Vault]
# PhysicalEconomy must register its Vault service before Blackjack asks Vault for it.
# Keep this as a soft dependency: the plugin still supports every Vault economy provider.
softdepend: [PlaceholderAPI, PhysicalEconomy]
loadbefore: []
# Economy plugins normally register their providers during the POSTWORLD phase.
load: POSTWORLD

commands:
  blackjack:
    description: Blackjack administration command
    usage: |
      &8[&6Blackjack&8] &rAdmin Commands:
      &e/bj createtable [min-bet:<n>] [max-bet:<n>] [max-players:<n>] [max-join-distance:<n>] &7- Create a blackjack table
      &e/bj settable <setting> <value> &7- Update the nearest table
      &e/bj removetable &7- Remove the nearest table
      &e/bj reload &7- Reload configuration
      &e/bj version &7- Show plugin version and update status
    aliases: [bj]

permissions:
  blackjack.admin:
    description: Allows creating, removing, and configuring blackjack tables
    default: op
  blackjack.play:
    description: Allows playing blackjack
    default: true
  blackjack.stats.others:
    description: Allows viewing other players' statistics
    default: op
