# ==============================================================================
# Blackjack Plugin Configuration
# ==============================================================================

# Language for player-facing messages. Supported values: en (default), tr.
# Run /bj reload after changing this value.
language: en

# Currency symbol used in GUIs, broadcasts, and messages (e.g. $, ₺, €, £)
currency-symbol: "$"

# Database Configuration (HikariCP Connection Pool)
# Supports SQLite (local file) and MySQL (remote or local database)
database:
  # Database type: SQLITE or MYSQL
  type: SQLITE
  
  # SQLite Settings
  sqlite:
    file: "blackjack.db"
    
  # MySQL Settings (used when type: MYSQL)
  mysql:
    host: "localhost"
    port: 3306
    database: "blackjack"
    username: "root"
    password: ""
    ssl: false
    
  # HikariCP Connection Pool Settings
  pool:
    maximum-pool-size: 10
    minimum-idle: 2
    connection-timeout-ms: 30000
    idle-timeout-ms: 600000
    max-lifetime-ms: 1800000

# Feature Toggles (Enable/Disable plugin features)
features:
  # Show confirmation GUI when player tries to leave chair with active bet (forfeits bet)
  leave-confirm-gui: true
  # Allow players to Double Down on their first two cards
  double-down: true
  # Display clickable quick-bet menu in chat
  quick-bets: true
  # Clickable chat action buttons ([KART ÇEK], [PAS], [İKİYE KATLA])
  interactive-chat-buttons: true
  # Physical chair sitting system (right-click chairs to sit)
  chair-sitting: true
  # Automatically remove inactive players from table so others can play
  auto-leave-inactivity: true
  # Automatically remove players who walk too far away from the table
  auto-leave-distance: true
  # Player stats tracking system and /bj stats command
  stats-tracker: true
  # Check for plugin updates on GitHub
  version-checker: true

# Betting Settings
betting:
  min-bet: 10
  max-bet: 10000
  cooldown-ms: 2000
  
  # Quick Bet Options (shown in chat when betting)
  quick-bets:
    small: [10, 25, 50]
    medium: [100, 250, 500]
    large: [1000, 2500, 5000]

# Table Settings (Roulette-style 3D models and chairs)
table:
  max-join-distance: 10.0
  max-players: 4
  # Visual Styling (OAK, SPRUCE, BIRCH, JUNGLE, ACACIA, DARK_OAK, MANGROVE, CHERRY)
  wood-type: DARK_OAK
  # Table felt color (GREEN, RED, BLUE, BLACK, PURPLE, etc.)
  felt-color: GREEN
  # Chair cushion color (RED, GREEN, BLUE, BLACK, etc.)
  chair-cushion-color: RED
  # Floating status hologram above table
  hologram:
    enabled: true
    title: "&6&lBLACKJACK"
    # Height offset above table center (default: 1.85)
    y-offset: 1.85
  # Chair sounds
  sounds:
    sit: BLOCK_WOODEN_TRAPDOOR_CLOSE
  # Legacy fallback materials
  table-material: GREEN_TERRACOTTA
  chair-material: DARK_OAK_STAIRS

# Game Rules
game:
  hit-soft-17: false  # Whether dealer hits on soft 17
  auto-leave-timeout-seconds: 30  # Time before inactive players are auto-removed when others are waiting

# Card Display Settings (ItemDisplay cards on table)
display:
  card:
    scale: 0.35
    spacing: 0.25
    player:
      height: 1.05
    dealer:
      height: 1.2

# Sound Settings
sounds:
  enabled: true
  card-deal:
    sound: BLOCK_WOODEN_BUTTON_CLICK_ON
    volume: 1.0
    pitch: 1.2
  win:
    sound: ENTITY_PLAYER_LEVELUP
    volume: 1.0
    pitch: 1.0
  lose:
    sound: ENTITY_VILLAGER_NO
    volume: 1.0
    pitch: 1.0
  push:
    sound: BLOCK_NOTE_BLOCK_PLING
    volume: 1.0
    pitch: 1.0

# Particle Settings
particles:
  enabled: true
  win:
    type: HAPPY_VILLAGER
    count: 20
    spread: 0.5
    height: 2.0
  lose:
    type: ANGRY_VILLAGER
    count: 10
    spread: 0.5
    height: 2.0

# Performance Settings
performance:
  # How often to save player statistics to database (in seconds)
  stats-save-interval: 3

# Game Settings
game-settings:
  # Whether to refund player bets when they leave during an active game
  # true = Refund bets when players leave mid-game (player-friendly)
  # false = Keep bets when players leave mid-game (house advantage)
  refund-on-leave: true
